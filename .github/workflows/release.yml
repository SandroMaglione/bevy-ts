name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Node 24 ships npm 11, which supports npm trusted publishing (OIDC).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TypeScript versions TSTyche downloads to type-test against (>=5.9).
      - name: Cache TypeScript versions for type tests
        uses: actions/cache@v6
        with:
          path: .tstyche
          key: tstyche-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: tstyche-

      - name: Check
        run: pnpm check

      - name: Check packed packages
        run: pnpm pack:check

      # With pending changesets this opens or updates the "Version Packages"
      # pull request. Without them it publishes every package whose version is
      # not on npm yet, then pushes the release tags.
      #
      # Publishing authenticates with npm trusted publishing (OIDC): every
      # package trusts this repository, `release.yml`, and the `npm`
      # environment. No npm token is stored.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
